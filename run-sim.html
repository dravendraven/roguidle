<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roguidle — sim console</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 16px 20px; background: #14161c; color: #d8dce6;
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px;
  }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .controls label { opacity: 0.8; }
  input[type="number"] {
    width: 110px; background: #1e222c; color: inherit;
    border: 1px solid #3a4150; border-radius: 6px; padding: 6px 8px;
  }
  button {
    background: #2d3444; color: inherit; border: 1px solid #4a5468;
    border-radius: 6px; padding: 7px 14px; cursor: pointer; font-size: 14px;
  }
  button:hover { background: #3a4358; }
  #progress { opacity: 0.7; }
  .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .col { background: #1a1e26; border: 1px solid #2b303c; border-radius: 10px; overflow: hidden; }
  .col h2 { font-size: 15px; margin: 0; padding: 10px 12px; background: #222736; }
  .summary { padding: 8px 12px; border-bottom: 1px solid #2b303c; line-height: 1.7; font-size: 13px; }
  .log { padding: 8px 12px; max-height: 55vh; overflow-y: auto; line-height: 1.65; font-size: 13px; }
  .log div { white-space: nowrap; }
  .floorline { opacity: 0.95; margin-top: 6px; font-weight: 600; }
  .fate { font-weight: 600; }
  #batch { margin-top: 20px; }
  table { border-collapse: collapse; margin: 10px 0; }
  th, td { border: 1px solid #333a48; padding: 5px 12px; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  .hist { font-family: Consolas, monospace; font-size: 12px; line-height: 1.5; white-space: pre; }
  .check { line-height: 1.8; }
</style>
</head>
<body>
<h1>🕳️ Roguidle — sim console</h1>
<p style="opacity:.6;max-width:60ch">Dev tool, not part of the play flow. Runs the same tick() the game uses,
headless, for a chronicle you can read in one screen or a 1,000-run batch for spotting broken floors.</p>

<div class="controls">
  <label>Seed <input id="seed" type="number" value="12345"></label>
  <button id="runBtn">Run one chronicle</button>
  <button id="batchBtn">Run 1,000-run batch</button>
  <span id="progress"></span>
</div>

<div class="cols" id="cols"></div>
<div id="batch"></div>

<script type="module">
import { initRun, tick } from './src/sim/tick.js';
import { makeRng, hashSeeds } from './src/sim/rng.js';

const MON = {
  rat: '🐀', bat: '🦇', spider: '🕷️', ghost: '👻', boar: '🐗', wolf: '🐺',
  ogre: '🧌', zombie: '🧟', vampire: '🧛', genie: '🧞', trex: '🦖', dragon: '🐉',
};

function runOnce(seed) {
  const state = initRun(seed);
  const rng = makeRng(hashSeeds(seed, 0xc0ffee)); // combat/loot stream
  const events = [];
  let guard = 0;
  while (!state.ended && guard++ < 200000) {
    const out = tick(state, null, rng);
    for (const e of out.events) events.push(e);
  }
  if (!state.ended) state.endReason = 'guard'; // should never happen
  return { state, events };
}

function monsterSummary(byType, elites) {
  const parts = Object.entries(byType).map(([t, n]) => (MON[t] || t) + (n > 1 ? '×' + n : ''));
  if (elites) parts.push('💢×' + elites);
  return parts.join(' ') || 'empty';
}

function chronicleLines(events) {
  const out = [];
  for (const e of events) {
    switch (e.type) {
      case 'floor_entered':
        out.push({ cls: 'floorline', text: `🌀 Floor ${e.depth} — ${monsterSummary(e.monsters, e.elites)}` });
        break;
      case 'monster_killed':
        out.push({ text: `⚔️ ${e.elite ? '💢 elite ' : ''}${MON[e.monster] || e.monster} slain (+${e.xp}xp${e.gold ? ', +' + e.gold + '🪙' : ''})` });
        break;
      case 'boss_killed':
        out.push({ text: `👑 ${e.emoji} boss falls (+${e.gold}🪙, chest dropped)` });
        break;
      case 'gold_found':
        out.push({ text: `${e.emoji || '🪙'} found ${e.amount} gold` });
        break;
      case 'rested':
        out.push({ text: `💤 rested ${e.from}→${e.to} hp` });
        break;
      case 'level_up':
        out.push({ text: `⬆️ level ${e.level}! (max hp ${e.maxHp})` });
        break;
      case 'hero_died':
        out.push({ cls: 'fate', text: `💀 slain by ${e.elite ? 'an elite ' : ''}${MON[e.killer] || e.killer} on floor ${e.depth} — ${e.lostGold}🪙 lost` });
        break;
      case 'out_of_rations':
        out.push({ cls: 'fate', text: `⛺ the larder is empty — making camp` });
        break;
      case 'stalled':
        out.push({ text: `🕳️ wandered too long — heads straight for the stairs` });
        break;
    }
  }
  return out;
}

function summaryHtml(state) {
  const s = state.stats;
  const fate = state.endReason === 'died' ? `💀 died on floor ${state.depth}` : state.endReason;
  const kills = `${s.kills}${s.eliteKills ? ' (' + s.eliteKills + ' elite)' : ''}`;
  return `
    <b>${fate}</b><br>
    depth ${s.maxDepth} · level ${state.hero.level} · ⚔️ ${kills} kills · 👑 ${s.bossKills} bosses<br>
    🪙 ${s.goldCollected} collected · ${state.endReason === 'died' ? state.carried.gold + '🪙 lost' : state.carried.gold + '🪙 still carried'}<br>
    ${state.t} ticks (${s.restTicks} resting) · rations left: ${state.hero.rations}`;
}

function renderChronicles() {
  const seed = Number(document.getElementById('seed').value) >>> 0;
  const cols = document.getElementById('cols');
  cols.innerHTML = '';
  const { state, events } = runOnce(seed);
  const col = document.createElement('div');
  col.className = 'col';
  const log = chronicleLines(events)
    .map((l) => `<div class="${l.cls || ''}">${l.text}</div>`)
    .join('');
  col.innerHTML = `<h2>seed ${seed}</h2><div class="summary">${summaryHtml(state)}</div><div class="log">${log}</div>`;
  cols.appendChild(col);
}

// ---- batch mode: the P0 balance testbed -----------------------------------

// Let the progress line repaint without setTimeout, which browsers clamp to
// ~1/sec in a background tab (that clamp, not the sim, was the batch's cost).
const yieldToUi = () =>
  new Promise((resolve) => {
    const ch = new MessageChannel();
    ch.port1.onmessage = () => resolve();
    ch.port2.postMessage(0);
  });

const mean = (a) => a.reduce((x, y) => x + y, 0) / (a.length || 1);
const median = (a) => {
  if (!a.length) return 0;
  const s = [...a].sort((x, y) => x - y);
  return s[Math.floor(s.length / 2)];
};

async function runBatch() {
  const baseSeed = Number(document.getElementById('seed').value) >>> 0;
  const N = 1000;
  const progress = document.getElementById('progress');
  const rows = [];
  const t0 = performance.now();

  for (let i = 0; i < N; i++) {
    const { state } = runOnce(hashSeeds(baseSeed, i));
    rows.push({
      died: state.endReason === 'died',
      deathFloor: state.endReason === 'died' ? state.depth : null,
      depth: state.stats.maxDepth,
      kills: state.stats.kills,
      bossKills: state.stats.bossKills,
      gold: state.stats.goldCollected,
      ticks: state.t,
    });
    if (i % 50 === 49) {
      progress.textContent = `${i + 1}/${N}…`;
      await yieldToUi();
    }
  }
  const secs = ((performance.now() - t0) / 1000).toFixed(1);
  progress.textContent = `batch done in ${secs}s`;
  renderBatch(rows, N);
}

function renderBatch(rows, N) {
  const deaths = rows.filter((x) => x.died);
  const stats = {
    diedPct: (100 * deaths.length) / N,
    medDeathFloor: median(deaths.map((x) => x.deathFloor)),
    avgDepth: mean(rows.map((x) => x.depth)),
    medDepth: median(rows.map((x) => x.depth)),
    avgKills: mean(rows.map((x) => x.kills)),
    avgBossKills: mean(rows.map((x) => x.bossKills)),
    avgGold: mean(rows.map((x) => x.gold)),
    avgTicks: mean(rows.map((x) => x.ticks)),
  };

  const fmt = (x, d = 1) => x.toFixed(d);
  let html = `<h2>Batch: ${N} runs, seed ${document.getElementById('seed').value}</h2><table>
    <tr><th>died %</th><th>median death floor</th><th>avg depth</th><th>median depth</th><th>avg kills</th><th>avg bosses</th><th>avg gold</th><th>avg ticks</th></tr>
    <tr><td>${fmt(stats.diedPct)}%</td><td>${stats.medDeathFloor || '—'}</td><td>${fmt(stats.avgDepth)}</td><td>${stats.medDepth}</td><td>${fmt(stats.avgKills)}</td><td>${fmt(stats.avgBossKills)}</td><td>${fmt(stats.avgGold)}</td><td>${fmt(stats.avgTicks, 0)}</td></tr>
  </table>`;

  const deathFloors = deaths.map((x) => x.deathFloor);
  if (deathFloors.length) {
    const maxF = Math.max(...deathFloors);
    let hist = 'death floors\n';
    for (let f = 1; f <= maxF; f++) {
      const n = deathFloors.filter((x) => x === f).length;
      if (!n && f > 15) continue;
      hist += String(f).padStart(3) + ' ' + '█'.repeat(Math.max(1, Math.round(n / 4))) + ' ' + n + '\n';
    }
    html += `<div class="hist">${hist}</div>`;
  }

  document.getElementById('batch').innerHTML = html;
}

document.getElementById('runBtn').addEventListener('click', renderChronicles);
document.getElementById('batchBtn').addEventListener('click', runBatch);
renderChronicles();
</script>
</body>
</html>
